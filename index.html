<style>
  :root {
    --bg: #0A0A0A;
    --text: #F2F2F2;
    --accent: #9CA3AF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;

    align-items: center;
    justify-content: center;

    letter-spacing: 0.15em;
  }
  h1 {

    font-weight: 700;
    font-size: clamp(1.5rem, 5vw, 2.75rem);
    line-height: 1.3;
    max-width: 700px;
  }
  .subline {
    margin-top: 14px;
    color: var(--accent);
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    max-width: 600px;
    line-height: 1.5;
  }
  p {
    margin-top: 28px;
    color: var(--accent);
    font-size: 1rem;
  }
  footer {
    position: absolute;
    bottom: 24px;
    font-size: 0.85rem;
    color: var(--accent);
  }
  footer a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
  }
